[project]
name = "govinfo-mcp-server"
version = "0.2.0"
description = "Model Context Protocol server providing LLM-friendly access to U.S. government documents through the GovInfo API v4"
authors = [{ name = "Travis-Prall", email = "" }]
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.14"
keywords = ["mcp", "govinfo", "legal", "api", "fastmcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

dependencies = [
  "fastmcp>=4.0.3",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "python-dotenv>=1.2.3",
  "anyio>=4.15.1",
  "pydantic>=2.13.5",
  "psutil>=7.2.2",
  "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://www.travisprall.com/"
Repository = "https://github.com/Travis-Prall/GovInfo"
Issues = "https://github.com/Travis-Prall/GovInfo/issues"
Funding = "https://www.buymeacoffee.com/travisprall"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  # Testing
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  # Code quality
  "mypy>=2.3.1",
  "ruff>=0.16.7",
  "pydantic>=2.13.5", # Add pydantic here as well for mypy plugin
  # Development tools
  "ipython>=9.17.1",
  "rich>=15.0.0",
  "httpx-sse>=0.4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]
